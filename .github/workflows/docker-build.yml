name: Build and Push Multi-Arch Docker Image

on:
  # 일반적인 main 변경
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/**'

  # FFmpeg workflow 완료 후 자동 실행
  workflow_run:
    workflows:
      - FFmpeg Multi-Arch Sequential Build
    types:
      - completed

  # 수동 실행
  workflow_dispatch:
    inputs:
      no_cache:
        description: '캐시를 사용하지 않고 처음부터 빌드 (No-Cache)'
        type: boolean
        default: false
        required: false

permissions:
  contents: read
  packages: write

env:
  DOCKER_IMAGE: ghcr.io/kman0001/tubesync-plex

jobs:
  build:
    # workflow_run인 경우 FFmpeg workflow가 성공했을 때만 실행
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # Checkout latest main
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      # ==========================================
      # Docker Buildx
      # ==========================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ==========================================
      # GHCR Login
      # ==========================================
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================
      # Build & Push Multi-Arch
      # ==========================================
      - name: Build & push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true

          platforms: |
            linux/amd64
            linux/arm64

          tags: |
            ${{ env.DOCKER_IMAGE }}:latest

          # 수동 실행에서만 No-Cache 적용
          no-cache: ${{ github.event_name == 'workflow_dispatch' && inputs.no_cache }}

          # GitHub Actions cache
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ==========================================
      # Verify
      # ==========================================
      - name: Build completed
        run: |
          echo "=========================================="
          echo "Docker multi-arch build completed"
          echo "=========================================="
          echo "Image: $DOCKER_IMAGE:latest"
          echo "Platforms:"
          echo "  - linux/amd64"
          echo "  - linux/arm64"
