name: Build and Push Multi-Arch Docker Image

on:
  # 일반적인 main 브랜치 코드 변경
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/**'

  # FFmpeg 자동 빌드가 성공적으로 끝난 경우
  workflow_run:
    workflows:
      - FFmpeg Multi-Arch Sequential Build
    types:
      - completed

  # 수동 실행
  workflow_dispatch:
    inputs:
      no_cache:
        description: '캐시를 사용하지 않고 처음부터 빌드 (No-Cache)'
        type: boolean
        default: false
        required: false

permissions:
  contents: read
  packages: write

env:
  DOCKER_IMAGE: ghcr.io/kman0001/tubesync-plex

jobs:
  build:
    # workflow_run으로 실행된 경우 FFmpeg workflow가 성공했을 때만 실행
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      # --------------------------------
      # Checkout
      # --------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # workflow_run에서 FFmpeg workflow가 push한
          # 최신 main을 확실하게 가져오기 위해 main 명시
          ref: main

      # --------------------------------
      # Docker Buildx
      # --------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------
      # GHCR Login
      # --------------------------------
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------
      # Build & Push
      # --------------------------------
      - name: Build & push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true

          platforms: |
            linux/amd64
            linux/arm64

          tags: |
            ${{ env.DOCKER_IMAGE }}:latest

          # 수동 실행에서만 No-Cache 체크박스 적용
          no-cache: ${{ github.event_name == 'workflow_dispatch' && inputs.no_cache }}

          # 일반 실행은 GitHub Actions cache 사용
          cache-from: type=gha
          cache-to: type=gha,mode=max
