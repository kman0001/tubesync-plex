name: Build and Push Multi-Arch Docker Image

on:

  # ==========================================
  # main 변경
  # ==========================================
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/**'


  # ==========================================
  # 수동 실행
  # ==========================================
  workflow_dispatch:
    inputs:
      no_cache:
        description: '캐시를 사용하지 않고 처음부터 빌드 (No-Cache)'
        type: boolean
        default: false
        required: false


permissions:
  contents: read
  packages: write


env:
  DOCKER_IMAGE: ghcr.io/kman0001/tubesync-plex


jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # Checkout latest main
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1


      # ==========================================
      # Docker Buildx
      # ==========================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ==========================================
      # GHCR Login
      # ==========================================
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # ==========================================
      # Build & Push Multi-Arch
      # ==========================================
      - name: Build & push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true

          platforms: |
            linux/amd64
            linux/arm64

          # latest만 사용
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest

          # 수동 실행에서만 No-Cache 적용
          no-cache: ${{ github.event_name == 'workflow_dispatch' && inputs.no_cache }}

          # GitHub Actions cache
          cache-from: type=gha
          cache-to: type=gha,mode=max


      # ==========================================
      # Cleanup old GHCR image sets
      #
      # Keep:
      #   - newest 3 Docker build sets
      #
      # Delete:
      #   - all versions belonging to older build sets
      #
      # A build set is determined by versions
      # created within 5 minutes of each other.
      # Tags are NOT used for cleanup decisions.
      # ==========================================
      - name: Cleanup old GHCR images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_NAME: tubesync-plex
          KEEP_BUILDS: 3
          BUILD_WINDOW_SECONDS: 300

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "GHCR cleanup"
          echo "=========================================="
          echo "Package: $PACKAGE_NAME"
          echo "Keeping newest $KEEP_BUILDS build sets"
          echo "Build grouping window: ${BUILD_WINDOW_SECONDS}s"
          echo "Tags are ignored"
          echo "=========================================="


          # ------------------------------------------
          # Get all package versions
          #
          # --slurp combines all paginated responses
          # into one JSON array.
          # ------------------------------------------
          gh api \
            --paginate \
            --slurp \
            -H "Accept: application/vnd.github+json" \
            "/user/packages/container/${PACKAGE_NAME}/versions?per_page=100" \
            > /tmp/ghcr_versions_pages.json


          # ------------------------------------------
          # Flatten paginated results
          # ------------------------------------------
          jq -r '
            add |
            .[] |
            [
              .id,
              .created_at,
              ((.metadata.container.tags // []) | join(","))
            ] |
            @tsv
          ' /tmp/ghcr_versions_pages.json \
          > /tmp/ghcr_versions.tsv


          TOTAL=$(wc -l < /tmp/ghcr_versions.tsv)

          echo
          echo "Found $TOTAL GHCR versions."


          if [ "$TOTAL" -eq 0 ]; then
            echo "No GHCR versions found."
            exit 0
          fi


          # ------------------------------------------
          # Build sets
          #
          # Versions are sorted newest first.
          #
          # If the next version was created within
          # BUILD_WINDOW_SECONDS of the current build
          # set, it belongs to the same build set.
          #
          # This groups multi-arch manifest/components
          # created together into one build.
          # ------------------------------------------
          sort -k2,2r /tmp/ghcr_versions.tsv \
            > /tmp/ghcr_versions_sorted.tsv


          python3 <<'PY'
          from datetime import datetime, timezone

          INPUT = "/tmp/ghcr_versions_sorted.tsv"
          OUTPUT = "/tmp/ghcr_versions_grouped.tsv"

          WINDOW = 300

          rows = []

          with open(INPUT, encoding="utf-8") as f:
              for line in f:
                  line = line.rstrip("\n")
                  if not line:
                      continue

                  parts = line.split("\t")
                  version_id = parts[0]
                  created_at = parts[1]
                  tags = parts[2] if len(parts) > 2 else ""

                  dt = datetime.fromisoformat(
                      created_at.replace("Z", "+00:00")
                  )

                  rows.append(
                      (version_id, created_at, tags, dt)
                  )

          # Already sorted newest first.
          current_group = -1
          previous_dt = None

          output = []

          for version_id, created_at, tags, dt in rows:

              if previous_dt is None:
                  current_group = 0

              else:
                  diff = (previous_dt - dt).total_seconds()

                  if diff > WINDOW:
                      current_group += 1

              output.append(
                  f"{current_group}\t"
                  f"{version_id}\t"
                  f"{created_at}\t"
                  f"{tags}"
              )

              previous_dt = dt

          with open(OUTPUT, "w", encoding="utf-8") as f:
              for line in output:
                  f.write(line + "\n")
          PY


          # ------------------------------------------
          # Determine build set count
          # ------------------------------------------
          BUILD_COUNT=$(cut -f1 /tmp/ghcr_versions_grouped.tsv |
            sort -n |
            uniq |
            wc -l)

          echo
          echo "Detected $BUILD_COUNT build sets."


          # ------------------------------------------
          # Show detected build sets
          # ------------------------------------------
          echo
          echo "Build sets:"
          echo "------------------------------------------"

          awk -F '\t' '
            {
              group=$1
              id=$2
              created=$3

              if (!(group in first_created)) {
                first_created[group]=created
                count[group]=0
              }

              count[group]++
              last_created[group]=created
            }

            END {
              for (i=0; i<=group; i++) {
                printf "Build set %d: %s -> %s (%d versions)\n",
                  i + 1,
                  first_created[i],
                  last_created[i],
                  count[i]
              }
            }
          ' /tmp/ghcr_versions_grouped.tsv


          # ------------------------------------------
          # Delete build sets older than KEEP_BUILDS
          # ------------------------------------------
          echo
          echo "Deleting build sets older than newest $KEEP_BUILDS..."


          awk -F '\t' -v keep="$KEEP_BUILDS" '
            $1 >= keep {
              print $2 "\t" $3 "\t" $4
            }
          ' /tmp/ghcr_versions_grouped.tsv \
          > /tmp/ghcr_delete.tsv


          DELETE_COUNT=$(wc -l < /tmp/ghcr_delete.tsv)

          echo
          echo "Versions scheduled for deletion: $DELETE_COUNT"


          if [ "$DELETE_COUNT" -eq 0 ]; then

            echo
            echo "No old build sets to delete."

          else

            while IFS=$'\t' read -r VERSION_ID CREATED_AT TAGS; do

              echo
              echo "DELETE:"
              echo "  version: $VERSION_ID"
              echo "  created: $CREATED_AT"
              echo "  tags:    ${TAGS:-<none>}"

              gh api \
                --method DELETE \
                -H "Accept: application/vnd.github+json" \
                "/user/packages/container/${PACKAGE_NAME}/versions/${VERSION_ID}"

            done < /tmp/ghcr_delete.tsv

          fi


          echo
          echo "=========================================="
          echo "GHCR cleanup completed"
          echo "=========================================="


      # ==========================================
      # Verify
      # ==========================================
      - name: Build completed
        run: |
          echo "=========================================="
          echo "Docker multi-arch build completed"
          echo "=========================================="
          echo "Image: $DOCKER_IMAGE:latest"
          echo "Platforms:"
          echo "  - linux/amd64"
          echo "  - linux/arm64"
