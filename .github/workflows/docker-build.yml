name: Build and Push Multi-Arch Docker Image

on:
  # 🛑 월 1회 정기 빌드는 비용 절감을 위해 주석 처리합니다.
  # schedule:
  #   - cron: '0 0 1 * *'

  # main 브랜치에 코드가 push되면 자동으로 빌드를 시작합니다. (기본 캐시 사용)
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/**'

  # ✅ 수동 실행 시 캐시 비활성화 여부를 선택할 수 있습니다.
  workflow_dispatch:
    inputs:
      no_cache:
        description: '캐시를 사용하지 않고 처음부터 빌드 (No-Cache)'
        type: boolean
        default: false
        required: false

permissions:
  contents: read
  packages: write

env:
  DOCKER_IMAGE: ghcr.io/kman0001/tubesync-plex

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 소스 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Docker Buildx 설정 (멀티 아키텍처 지원)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. GHCR 로그인
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. 멀티아키 이미지 빌드 및 푸시
      - name: Build & push multi-arch image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.DOCKER_IMAGE }}:latest
          # 💡 [핵심 수정] 수동 실행 시 체크박스를 켜면 Docker 자체 no-cache가 작동합니다.
          no-cache: ${{ github.event.inputs.no_cache == 'true' }}
          # 💡 수동 실행 시 체크박스를 켜면 GitHub Actions 캐시 저장을 건너뜁니다.
          cache-from: ${{ github.event.inputs.no_cache == 'true' && '' || 'type=gha' }}
          cache-to: ${{ github.event.inputs.no_cache == 'true' && '' || 'type=gha,mode=max' }}
