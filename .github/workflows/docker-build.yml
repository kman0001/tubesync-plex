name: Build and Push Multi-Arch Docker Image

on:

  # ==========================================
  # main 변경
  # ==========================================
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/**'

  # ==========================================
  # 수동 실행
  # ==========================================
  workflow_dispatch:
    inputs:
      no_cache:
        description: '캐시를 사용하지 않고 처음부터 빌드 (No-Cache)'
        type: boolean
        default: false
        required: false


permissions:
  contents: read
  packages: write


env:
  DOCKER_IMAGE: ghcr.io/kman0001/tubesync-plex


jobs:

  # ==========================================
  # Build
  # ==========================================
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # Checkout latest main
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1


      # ==========================================
      # Get actual checked-out commit SHA
      # ==========================================
      - name: Get commit SHA
        id: commit
        run: |
          SHA=$(git rev-parse HEAD)

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

          echo "Checked out commit:"
          echo "$SHA"


      # ==========================================
      # Docker Buildx
      # ==========================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ==========================================
      # GHCR Login
      # ==========================================
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # ==========================================
      # Build & Push Multi-Arch
      # ==========================================
      - name: Build & push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true

          platforms: |
            linux/amd64
            linux/arm64

          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:sha-${{ steps.commit.outputs.sha }}

          # 수동 실행에서만 No-Cache 적용
          no-cache: ${{ github.event_name == 'workflow_dispatch' && inputs.no_cache }}

          # GitHub Actions cache
          cache-from: type=gha
          cache-to: type=gha,mode=max


      # ==========================================
      # Cleanup old GHCR images
      #
      # Keep:
      #   - latest
      #   - newest 10 sha-* versions
      # ==========================================
      - name: Cleanup old GHCR images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_NAME: tubesync-plex
          KEEP_COUNT: 10

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "GHCR cleanup"
          echo "=========================================="
          echo "Package: $PACKAGE_NAME"
          echo "Keeping newest $KEEP_COUNT sha-* versions"
          echo "latest will always be preserved"
          echo "=========================================="


          # ------------------------------------------
          # Get all package versions
          # ------------------------------------------
          gh api \
            --paginate \
            -H "Accept: application/vnd.github+json" \
            "/user/packages/container/${PACKAGE_NAME}/versions?per_page=100" \
            > /tmp/ghcr_versions.json


          # ------------------------------------------
          # Extract:
          # version ID
          # creation time
          # tags
          # ------------------------------------------
          jq -r '
            .[] |
            [
              .id,
              .created_at,
              ((.metadata.container.tags // []) | join(","))
            ] |
            @tsv
          ' /tmp/ghcr_versions.json \
          > /tmp/ghcr_versions.tsv


          # ------------------------------------------
          # Find sha-* versions
          # newest first
          # ------------------------------------------
          mapfile -t SHA_VERSIONS < <(
            awk -F '\t' '
              $3 ~ /(^|,)sha-[^,]+(,|$)/ {
                print
              }
            ' /tmp/ghcr_versions.tsv |
            sort -k2,2r
          )


          TOTAL=${#SHA_VERSIONS[@]}

          echo
          echo "Found $TOTAL sha-* versions."


          # ------------------------------------------
          # Delete versions older than KEEP_COUNT
          # ------------------------------------------
          if [ "$TOTAL" -le "$KEEP_COUNT" ]; then

            echo "Nothing to delete."

          else

            echo
            echo "Deleting old versions..."

            for ((i=KEEP_COUNT; i<TOTAL; i++)); do

              VERSION_ID=$(echo "${SHA_VERSIONS[$i]}" | cut -f1)
              CREATED_AT=$(echo "${SHA_VERSIONS[$i]}" | cut -f2)
              TAGS=$(echo "${SHA_VERSIONS[$i]}" | cut -f3)


              # ----------------------------------------
              # Safety:
              # Never delete a version containing latest
              # ----------------------------------------
              if echo ",$TAGS," | grep -q ',latest,'; then

                echo "SKIP: $VERSION_ID"
                echo "      tags: $TAGS"
                echo "      reason: latest"

                continue
              fi


              echo "DELETE: $VERSION_ID"
              echo "       created: $CREATED_AT"
              echo "       tags: $TAGS"


              gh api \
                --method DELETE \
                -H "Accept: application/vnd.github+json" \
                "/user/packages/container/${PACKAGE_NAME}/versions/${VERSION_ID}"

            done

          fi


          echo
          echo "=========================================="
          echo "GHCR cleanup completed"
          echo "=========================================="


      # ==========================================
      # Verify
      # ==========================================
      - name: Build completed
        run: |
          echo "=========================================="
          echo "Docker multi-arch build completed"
          echo "=========================================="
          echo "Image: $DOCKER_IMAGE:latest"
          echo "SHA: sha-${{ steps.commit.outputs.sha }}"
          echo "Platforms:"
          echo "  - linux/amd64"
          echo "  - linux/arm64"
