name: FFmpeg Multi-Arch Sequential Build

on:
  schedule:
    - cron: '0 1 1 * *' # 매월 1일 UTC 01:00

  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_ROOT: ${{ github.workspace }}/ffmpeg

jobs:
  build_and_push:
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # Checkout
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================
      # Dependencies
      # ==========================================
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            build-essential \
            cmake \
            git \
            libtool \
            pkg-config \
            yasm \
            nasm \
            curl \
            wget \
            zlib1g-dev \
            libfdk-aac-dev \
            libass-dev \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu

      # ==========================================
      # Find latest FFmpeg release
      # ==========================================
      - name: Fetch latest FFmpeg release version
        id: ffver
        run: |
          LATEST=$(curl -fsSL https://ffmpeg.org/releases/ \
            | grep -oE 'ffmpeg-[0-9]+\.[0-9]+(\.[0-9]+)?\.tar\.bz2' \
            | sed -E 's/ffmpeg-|\.tar\.bz2//g' \
            | sort -V \
            | tail -1)

          if [ -z "$LATEST" ]; then
            echo "ERROR: Failed to determine latest FFmpeg version"
            exit 1
          fi

          echo "FF_VERSION=$LATEST" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "Latest FFmpeg version: $LATEST"
          echo "=========================================="

      # ==========================================
      # Build AMD64
      # ==========================================
      - name: Build FFmpeg (amd64)
        run: |
          set -e

          ARCH_DIR="$BUILD_ROOT/amd64"
          mkdir -p "$ARCH_DIR"

          EXISTING_VERSION=$(cat "$ARCH_DIR/version.txt" 2>/dev/null || echo "0.0.0")

          echo "Installed amd64 version: $EXISTING_VERSION"
          echo "Latest FFmpeg version:   $FF_VERSION"

          if dpkg --compare-versions "$EXISTING_VERSION" "ge" "$FF_VERSION"; then
            echo "FFmpeg amd64 is already up to date."
            exit 0
          fi

          rm -rf \
            "ffmpeg-${FF_VERSION}" \
            "ffmpeg-${FF_VERSION}.tar.bz2"

          wget -q \
            "https://ffmpeg.org/releases/ffmpeg-${FF_VERSION}.tar.bz2"

          tar xjf "ffmpeg-${FF_VERSION}.tar.bz2"

          cd "ffmpeg-${FF_VERSION}"

          ./configure \
            --prefix="$ARCH_DIR" \
            --arch=x86_64 \
            --target-os=linux \
            --disable-doc \
            --disable-ffplay \
            --disable-network \
            --disable-debug \
            --enable-small \
            --disable-everything \
            --enable-ffmpeg \
            --enable-ffprobe \
            --enable-decoder=subrip \
            --enable-decoder=dvdsub \
            --enable-decoder=hdmv_pgs \
            --enable-demuxer=mov \
            --enable-demuxer=matroska \
            --enable-muxer=mp4 \
            --enable-muxer=mkv \
            --enable-parser=subrip

          make -j"$(nproc)"
          make install

          cp -f "$ARCH_DIR/bin/ffmpeg" "$ARCH_DIR/ffmpeg"
          cp -f "$ARCH_DIR/bin/ffprobe" "$ARCH_DIR/ffprobe"

          rm -rf "$ARCH_DIR/bin"

          echo "$FF_VERSION" > "$ARCH_DIR/version.txt"

          cd "$GITHUB_WORKSPACE"

          echo "=========================================="
          echo "AMD64 build completed"
          echo "=========================================="

          ls -lh "$ARCH_DIR"

      # ==========================================
      # Build ARM64
      # ==========================================
      - name: Build FFmpeg (arm64)
        run: |
          set -e

          ARCH_DIR="$BUILD_ROOT/arm64"
          mkdir -p "$ARCH_DIR"

          EXISTING_VERSION=$(cat "$ARCH_DIR/version.txt" 2>/dev/null || echo "0.0.0")

          echo "Installed arm64 version: $EXISTING_VERSION"
          echo "Latest FFmpeg version:   $FF_VERSION"

          if dpkg --compare-versions "$EXISTING_VERSION" "ge" "$FF_VERSION"; then
            echo "FFmpeg arm64 is already up to date."
            exit 0
          fi

          rm -rf \
            "ffmpeg-${FF_VERSION}" \
            "ffmpeg-${FF_VERSION}.tar.bz2"

          wget -q \
            "https://ffmpeg.org/releases/ffmpeg-${FF_VERSION}.tar.bz2"

          tar xjf "ffmpeg-${FF_VERSION}.tar.bz2"

          cd "ffmpeg-${FF_VERSION}"

          ./configure \
            --prefix="$ARCH_DIR" \
            --arch=aarch64 \
            --target-os=linux \
            --enable-cross-compile \
            --cross-prefix=aarch64-linux-gnu- \
            --disable-doc \
            --disable-ffplay \
            --disable-network \
            --disable-debug \
            --enable-small \
            --disable-everything \
            --enable-ffmpeg \
            --enable-ffprobe \
            --enable-decoder=subrip \
            --enable-decoder=dvdsub \
            --enable-decoder=hdmv_pgs \
            --enable-demuxer=mov \
            --enable-demuxer=matroska \
            --enable-muxer=mp4 \
            --enable-muxer=mkv \
            --enable-parser=subrip

          make -j"$(nproc)"
          make install

          cp -f "$ARCH_DIR/bin/ffmpeg" "$ARCH_DIR/ffmpeg"
          cp -f "$ARCH_DIR/bin/ffprobe" "$ARCH_DIR/ffprobe"

          rm -rf "$ARCH_DIR/bin"

          echo "$FF_VERSION" > "$ARCH_DIR/version.txt"

          cd "$GITHUB_WORKSPACE"

          echo "=========================================="
          echo "ARM64 build completed"
          echo "=========================================="

          ls -lh "$ARCH_DIR"

      # ==========================================
      # Verify both binaries
      # ==========================================
      - name: Verify FFmpeg builds
        run: |
          set -e

          test -x ffmpeg/amd64/ffmpeg
          test -x ffmpeg/amd64/ffprobe

          test -x ffmpeg/arm64/ffmpeg
          test -x ffmpeg/arm64/ffprobe

          test -f ffmpeg/amd64/version.txt
          test -f ffmpeg/arm64/version.txt

          echo "=========================================="
          echo "FFmpeg build verification successful"
          echo "=========================================="

          echo "AMD64:"
          cat ffmpeg/amd64/version.txt
          file ffmpeg/amd64/ffmpeg

          echo ""
          echo "ARM64:"
          cat ffmpeg/arm64/version.txt
          file ffmpeg/arm64/ffmpeg

      # ==========================================
      # Commit & Push ONCE
      # ==========================================
      - name: Commit and push FFmpeg builds
        run: |
          set -e

          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add -f \
            ffmpeg/amd64/ffmpeg \
            ffmpeg/amd64/ffprobe \
            ffmpeg/amd64/version.txt \
            ffmpeg/arm64/ffmpeg \
            ffmpeg/arm64/ffprobe \
            ffmpeg/arm64/version.txt

          if git diff --cached --quiet; then
            echo "No FFmpeg changes to commit."
            exit 0
          fi

          git commit \
            -m "Auto-build FFmpeg $FF_VERSION (multi-arch)"

          git push origin main
