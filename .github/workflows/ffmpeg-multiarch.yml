name: FFmpeg Multi-Arch Sequential Build

on:
  schedule:
    - cron: '0 1 1 * *' # 매월 1일 UTC 01:00
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_ROOT: ${{ github.workspace }}/ffmpeg

jobs:
  build_and_push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake build-essential cmake git \
            libtool pkg-config yasm nasm curl wget \
            zlib1g-dev libfdk-aac-dev libass-dev \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Fetch latest FFmpeg release version
        id: ffver
        run: |
          LATEST=$(curl -fsSL https://ffmpeg.org/releases/ \
            | grep -oE 'ffmpeg-[0-9]+\.[0-9]+(\.[0-9]+)?\.tar\.bz2' \
            | sed -E 's/ffmpeg-|\.tar\.bz2//g' \
            | sort -V \
            | tail -1)

          if [ -z "$LATEST" ]; then
            echo "Failed to determine latest FFmpeg version"
            exit 1
          fi

          echo "FF_VERSION=$LATEST" >> "$GITHUB_ENV"
          echo "Latest FFmpeg version: $LATEST"

      # --------------------------------
      # Build x86_64
      # --------------------------------
      - name: Build FFmpeg (x86_64)
        run: |
          ARCH_DIR="$BUILD_ROOT/x86_64"
          mkdir -p "$ARCH_DIR"

          EXISTING_VERSION=$(cat "$ARCH_DIR/version.txt" 2>/dev/null || echo "0.0.0")

          if dpkg --compare-versions "$EXISTING_VERSION" "ge" "$FF_VERSION"; then
            echo "FFmpeg x86_64 already up to date:"
            echo "  installed: $EXISTING_VERSION"
            echo "  latest:    $FF_VERSION"
            exit 0
          fi

          rm -rf "ffmpeg-${FF_VERSION}" "ffmpeg-${FF_VERSION}.tar.bz2"

          wget -q "https://ffmpeg.org/releases/ffmpeg-${FF_VERSION}.tar.bz2"
          tar xjf "ffmpeg-${FF_VERSION}.tar.bz2"

          cd "ffmpeg-${FF_VERSION}"

          ./configure \
            --prefix="$ARCH_DIR" \
            --arch=x86_64 \
            --target-os=linux \
            --disable-doc \
            --disable-ffplay \
            --disable-network \
            --disable-debug \
            --enable-small \
            --disable-programs \
            --enable-ffmpeg \
            --enable-ffprobe \
            --disable-everything \
            --enable-decoder=subrip \
            --enable-decoder=dvdsub \
            --enable-decoder=hdmv_pgs \
            --enable-demuxer=mov \
            --enable-demuxer=matroska \
            --enable-muxer=mp4 \
            --enable-muxer=mkv \
            --enable-parser=subrip

          make -j"$(nproc)"
          make install

          cp -f "$ARCH_DIR/bin/ffmpeg" "$ARCH_DIR/ffmpeg"
          cp -f "$ARCH_DIR/bin/ffprobe" "$ARCH_DIR/ffprobe"
          rm -rf "$ARCH_DIR/bin"

          echo "$FF_VERSION" > "$ARCH_DIR/version.txt"

          cd "$GITHUB_WORKSPACE"

          echo "x86_64 build completed:"
          ls -lh "$ARCH_DIR"

      # --------------------------------
      # Build aarch64
      # --------------------------------
      - name: Build FFmpeg (aarch64)
        run: |
          ARCH_DIR="$BUILD_ROOT/aarch64"
          mkdir -p "$ARCH_DIR"

          EXISTING_VERSION=$(cat "$ARCH_DIR/version.txt" 2>/dev/null || echo "0.0.0")

          if dpkg --compare-versions "$EXISTING_VERSION" "ge" "$FF_VERSION"; then
            echo "FFmpeg aarch64 already up to date:"
            echo "  installed: $EXISTING_VERSION"
            echo "  latest:    $FF_VERSION"
            exit 0
          fi

          rm -rf "ffmpeg-${FF_VERSION}" "ffmpeg-${FF_VERSION}.tar.bz2"

          wget -q "https://ffmpeg.org/releases/ffmpeg-${FF_VERSION}.tar.bz2"
          tar xjf "ffmpeg-${FF_VERSION}.tar.bz2"

          cd "ffmpeg-${FF_VERSION}"

          ./configure \
            --prefix="$ARCH_DIR" \
            --arch=aarch64 \
            --target-os=linux \
            --enable-cross-compile \
            --cross-prefix=aarch64-linux-gnu- \
            --disable-doc \
            --disable-ffplay \
            --disable-network \
            --disable-debug \
            --enable-small \
            --disable-programs \
            --enable-ffmpeg \
            --enable-ffprobe \
            --disable-everything \
            --enable-decoder=subrip \
            --enable-decoder=dvdsub \
            --enable-decoder=hdmv_pgs \
            --enable-demuxer=mov \
            --enable-demuxer=matroska \
            --enable-muxer=mp4 \
            --enable-muxer=mkv \
            --enable-parser=subrip

          make -j"$(nproc)"
          make install

          cp -f "$ARCH_DIR/bin/ffmpeg" "$ARCH_DIR/ffmpeg"
          cp -f "$ARCH_DIR/bin/ffprobe" "$ARCH_DIR/ffprobe"
          rm -rf "$ARCH_DIR/bin"

          echo "$FF_VERSION" > "$ARCH_DIR/version.txt"

          cd "$GITHUB_WORKSPACE"

          echo "aarch64 build completed:"
          ls -lh "$ARCH_DIR"

      # --------------------------------
      # Commit & Push - ONLY ONCE
      # --------------------------------
      - name: Commit and push FFmpeg builds
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add \
            ffmpeg/x86_64/ffmpeg \
            ffmpeg/x86_64/ffprobe \
            ffmpeg/x86_64/version.txt \
            ffmpeg/aarch64/ffmpeg \
            ffmpeg/aarch64/ffprobe \
            ffmpeg/aarch64/version.txt

          if git diff --cached --quiet; then
            echo "No FFmpeg changes to commit."
            exit 0
          fi

          git commit -m "Auto-build FFmpeg $FF_VERSION (multi-arch)"
          git push origin main
